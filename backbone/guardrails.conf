# Project guardrail rules (project-owned). The core rules live in scripts/harness/guardrails.core.conf.
#
#   <block|warn> | <path regex, or @bash for shell commands> | <content regex> | <message>
#
# Fields are separated by " | ". Regexes are Python syntax and match per line. Only added text is checked.
# Turn each NEVER DO item in 4-KNOWLEDGE.md that a regex can detect into a block rule.
#
# Stack packs adopted from the stack ADR add their rules here as marked blocks (harness.py adopt).
#
# Examples (remove the leading "# " to enable):
# block | /domain/ | ^(import|from) .*\b(infra|infrastructure)\b | Domain must not depend on infrastructure.
# warn  | \.(ts|tsx)$ | console\.log\( | Use the logger instead of console.log.
# block | @bash | \bnpm\s+publish\b | Publishing is done by CI only.

# >>> adopted pack: java (ADR-002, 2026-10-05; options: gradle, junit5-assertj, no-lombok) >>>
warn | \.java$ | \bSystem\.(out|err)\.print | Use the logger instead of System.out/System.err.
warn | \.java$ | \.printStackTrace\(\) | Log the exception with context, or rethrow it; don't print stack traces.
warn | \.java$ | catch\s*\([^)]*\)\s*\{\s*\} | Empty catch block swallows the error; handle, translate or rethrow it.
block | (^|/)src/(test|integrationTest|native-test|it)/.*\.java$ | ^import (static )?org\.junit\.jupiter\.api\.Assertions\b | Use AssertJ assertThat, not JUnit assertions (java-test skill).
block | (^|/)src/(test|integrationTest|native-test|it)/.*\.java$ | ^import (static )?org\.junit\.(Test|Assert|Before|After|BeforeClass|AfterClass|Ignore|Rule)\b | Use JUnit 5 (org.junit.jupiter), not JUnit 4 (java-test skill).
block | \.java$ | ^import lombok\. | Lombok is not used in this project (stack ADR): use records, static factories and explicit constructors.
# <<< adopted pack: java <<<

# >>> adopted pack: jdbi (ADR-002, 2026-10-05; options: no-orm, hexagonal-layers, flyway) >>>
warn | \.java$ | @Define\b | @Define substitutes text into SQL unescaped: only for whitelisted identifiers, never for user input (jdbi skill).
block | \.java$ | ^import (jakarta|javax)\.persistence\. | The stack ADR rules out JPA: persistence is SQL-first with JDBI (jdbi skill).
block | \.java$ | ^import (org\.hibernate\.(?!validator\b)|io\.quarkus\.hibernate\.orm\b|io\.quarkus\.hibernate\.reactive\b|io\.quarkus\.panache\b) | The stack ADR rules out Hibernate ORM/Reactive and Panache: use JDBI (Hibernate Validator is allowed).
block | (^|/)(build\.gradle(\.kts)?|pom\.xml)$ | quarkus-hibernate-orm|quarkus-hibernate-reactive|panache|hibernate-core | The stack ADR rules out ORM dependencies: use JDBI (jdbi skill).
block | /domain/.*\.java$ | ^import org\.jdbi\. | JDBI belongs in infrastructure adapters; map *Row records to domain types there (jdbi skill).
# <<< adopted pack: jdbi <<<

# Project rules (4-KNOWLEDGE.md NEVER DO; ADR-002).
block | /domain/.*\.java$ | ^import (io\.jooby|io\.avaje|jakarta\.|com\.fasterxml\.jackson)\. | The domain layer is framework-free: no Jooby, Avaje, Jakarta or Jackson types (4-KNOWLEDGE design rule 1).
block | /app/.*\.java$ | ^import (io\.jooby|org\.jdbi|com\.fasterxml\.jackson)\. | The application layer has no framework or JDBI code; depend on ports (4-KNOWLEDGE design rule 1).
block | (/infra/(io/)?rest/[^/]+|Controller)\.java$ | ^import org\.jdbi\. | Controllers never receive Jdbi; call an application service (4-KNOWLEDGE design rule 2, task 6.1).
block | \.java$ | ^import jakarta\.ws\.rs\. | Use Jooby annotations (io.jooby.annotation.*), not JAX-RS (jooby skill).
block | \.java$ | ^import jakarta\.(enterprise|transaction|interceptor)\. | No CDI or Jakarta EE APIs: use Avaje Inject (@Singleton, @Factory/@Bean, @Aspect) and JDBI transactions (jooby skill).
block | \.java$ | @(ApplicationScoped|Produces|Transactional|InterceptorBinding)\b | CDI/Jakarta EE annotation: use @Singleton, @Factory + @Bean, the JDBI handle, or Avaje @Aspect (jooby skill).
block | \.java$ | \bmvc\(\s*[A-Z]\w*\.class\s*\) | Register controllers with mvc(new Controller_()) (jooby skill).
warn | (^|/)frontend/src/.*\.tsx$ | >\s*[A-Z][a-z]+( [a-z]+){1,}\s*< | Hard-coded UI text: use <FormattedMessage> with keys in en.ts and es.ts (frontend skill).
