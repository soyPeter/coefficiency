# Project skill routes (project-owned). The core routes live in scripts/harness/routing.core.conf.
#
#   <path regex> | <skill>[, <skill>...] | <why>
#
# Before an agent edits a file whose repo-relative path matches, it must have loaded every listed
# skill in the current session. Stack packs adopted from the stack ADR add their routes here as marked
# blocks (harness.py adopt). Add your own routes for project skills below, for example:
# ^backbone/adr/ | <language-skill> | ADRs must respect the language's idioms.
# (?i)/(api|rest|web)/ | api-design, openapi | Outer API layer.
# /domain/ | architecture | Domain layer boundaries.

# >>> adopted pack: java (ADR-002, 2026-10-05; options: gradle, junit5-assertj, no-lombok) >>>
\.java$ | java | All Java code.
^backbone/adr/[^/]+\.md$ | java | ADRs must respect the language's idioms.
(^|/)src/(test|integrationTest|native-test|it)/.*\.java$ | java-test | Java tests.
# <<< adopted pack: java <<<

# >>> adopted pack: jdbi (ADR-002, 2026-10-05; options: no-orm, hexagonal-layers, flyway) >>>
(?i)(^|/)src/main/java/(.*/)?((persistence|repository|repositories|jdbi|dao|db)/.*|[^/]*(Repository|Dao|Row|RowMapper))\.java$ | jdbi | Persistence adapters and row mapping.
(^|/)src/main/resources/db/migration/.*\.sql$ | jdbi | Flyway migrations.
# <<< adopted pack: jdbi <<<

# Project routes (ADR-002; project skills in .claude/skills).
(^|/)services/coeff/src/main/java/.*/infra/.*\.java$ | jooby | Jooby controllers, modules and Avaje wiring.
(^|/)services/coeff/src/main/java/[^/]+/[^/]+/[^/]+/[^/]*(App|Application|Module|Factory|Config)\.java$ | jooby | Application setup and wiring.
(^|/)services/coeff/src/main/java/.*/infra/(io/)?rest/.*\.java$ | api-design | REST layer.
(^|/)services/coeff/src/main/java/(.*/)?domain/.*\.java$ | architecture | Domain layer boundaries.
(^|/)services/coeff/frontend/src/.*\.(ts|tsx|css)$ | frontend | React SPA.
(^|/)db/migration/.*\.sql$|(^|/)Sqlite[^/]*\.java$ | sqlite | SQLite schema and migration constraints.
