id: "CAPA-005"
ncr: "NCR-005"
status: closed
owner: dev
due: "2026-06-27"
root_cause: "Flyway.configure() in SqliteConnection.init() did not set baselineOnMigrate=true. When reinit() is called after a dump restore, Flyway finds existing tables (created by the dump SQL) but no flyway_schema_history table, and migrate() fails by default."
action_plan: "Add .baselineOnMigrate(true) to Flyway.configure() chain in SqliteConnection.init(). This tells Flyway to automatically baseline non-empty schemas without a history table."
verification: "baselineOnMigrate(true) added to Flyway.configure() in SqliteConnection.init(). Dump restore now correctly baselines existing schemas."
closed_date: "2026-06-27"
