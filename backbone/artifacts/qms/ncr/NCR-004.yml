title: "ConsultantPage fails after importing Javalin dump — missing created_at/updated_at columns in consultants table"
severity: major
category: code
source: incident
description: "When importing a Javalin-format SQL dump, the consultants table is created without created_at and updated_at columns. After restore, JDBI's ConstructorMapper fails to map ConsultantRow because these columns don't exist in the result set, causing ConsultantController.list() to throw IllegalArgumentException."
