id: "NCR-005"
date: "2026-06-27"
title: "Dump restore fails after Flyway init — non-empty schema without history table"
severity: major
category: code
source: incident
description: "After restoring a dump, the restored database has tables but no flyway_schema_history table. Flyway.migrate() refuses to run because it detects non-empty schema without a history table. Fix: set baselineOnMigrate(true) so Flyway baselines existing schemas automatically."
status: closed
