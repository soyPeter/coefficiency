apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __SERVICE__-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __GIT_REPO__
    targetRevision: HEAD
    path: services/__SERVICE__/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: __NAMESPACE__
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
