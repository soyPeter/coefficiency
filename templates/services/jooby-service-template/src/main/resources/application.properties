application.name=__SERVICE__-service

# --- Server ---
server.port=8080

# --- Database ---
db.url=jdbc:postgresql://localhost:5432/__SERVICE__db
db.username=postgres
db.password=postgres

# --- Flyway ---
flyway.enabled=true
flyway.url=${db.url}
flyway.user=${db.username}
flyway.password=${db.password}

# --- Logging ---
logging.level.root=INFO
logging.level.__PACKAGE__=DEBUG
